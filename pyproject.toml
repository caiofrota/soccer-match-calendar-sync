[project]
name = "soccer-match-calendar-sync"
version = "0.1.0"
description = "Synchronize SportScore football fixtures with Google Calendar or ICS files."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "google-api-python-client>=2.181,<3",
  "google-auth>=2.40,<3",
  "google-auth-httplib2>=0.2,<1",
  "requests>=2.32,<3",
]

[dependency-groups]
dev = [
  "mypy>=2.3.0,<3",
  "ruff>=0.12,<1",
  "types-requests>=2.32,<3",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.ruff.lint.per-file-ignores]
"test_match_sync.py" = ["E402"]

[tool.mypy]
python_version = "3.11"
files = ["match_sync.py", "sportscore_client.py"]
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_configs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["google.*", "googleapiclient.*"]
ignore_missing_imports = true
