name: Upcoming Matches

on:
  schedule:
    - cron: "17 8,20 * * *"
  workflow_dispatch:

jobs:
  crawl: 
    runs-on: ubuntu-latest

    strategy:
      matrix:
        target:
          - name: champions-league
            url: "https://www.placardefutebol.com.br/champions-league"
            calendar_id: "401be6a3ffc7a181b7569f3dfa362cd7bf797ac26d05f5b49ec3e8043a42bad8@group.calendar.google.com"
          - name: copa-america
            url: "https://www.placardefutebol.com.br/copa-america"
            calendar_id: "fe1896bb7a29bfc75ceef4e36c22187fa0b3ccb3a60c7275f07bc7dc8b498531@group.calendar.google.com"
          - name: eurocopa
            url: "https://www.placardefutebol.com.br/eurocopa"
            calendar_id: "6c59ceb5c9d3c0d508a7c365fac106b18a2b1f5e8cf61f256b38b19e8c206dc1@group.calendar.google.com"
          - name: copa-da-liga-inglesa
            url: "https://www.placardefutebol.com.br/copa-da-liga-inglesa"
            calendar_id: "28df770f8678c4f6890da87576397504c150669c30d8e2ed6d23fd0262a441a7@group.calendar.google.com"
          - name: ceara
            url: "https://www.placardefutebol.com.br/time/ceara/proximos-jogos"
            calendar_id: "2229d57329c1589bf08b9a2752fc29be6fcb7139409a300fb9bd63f866d24a60@group.calendar.google.com"
          - name: brasil
            url: "https://www.placardefutebol.com.br/time/brasil/proximos-jogos"
            calendar_id: "5e4c412c5caba27497079e63dd4f54b4eb50f6dafe409a07a58ec63069199558@group.calendar.google.com"
          - name: copa-do-mundo
            url: "https://www.placardefutebol.com.br/copa-do-mundo"
            calendar_id: "055de4983aede32a642bd40331aeffaa1bf2c0f2e65919a432499464f24f28c0@group.calendar.google.com"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Create credentials.json from secret
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python - << 'PY'
          import os, json, pathlib

          raw = os.environ["GOOGLE_CREDENTIALS_JSON"]

          print("Received secret size:", len(raw), "chars")

          try:
            data = json.loads(raw)
          except json.JSONDecodeError as e:
            print("Error decoding JSON from secret:", e)
            print("First 200 chars of the secret:")
            print(raw[:200])
            raise

          path = pathlib.Path("credentials.json")
          path.write_text(json.dumps(data), encoding="utf-8")
          print("credentials.json generated successfully, size:", path.stat().st_size, "bytes")
          PY

      - name: Run crawler for ${{ matrix.target.name }}
        run: |
          python crawler.py gcalendar \
            --url "${{ matrix.target.url }}" \
            --calendar-id "${{ matrix.target.calendar_id }}"