name: Upcoming Matches - Ceará

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Execute script
        run: python crawler.py https://www.placardefutebol.com.br/time/ceara/proximos-jogos "${{ secrets.GCALENDAR_CEARA }}"