name: Soccer Match Calendar Sync

on:
  schedule:
    - cron: "0 8,20 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: soccer-match-calendar-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    strategy:
      fail-fast: false
      matrix:
        target:
          - name: champions-league
            type: competition
            slug: uefa-champions-league
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_CHAMPIONS_LEAGUE }}
          - name: copa-america
            type: competition
            slug: conmebol-copa-america
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_COPA_AMERICA }}
          - name: eurocopa
            type: competition
            slug: uefa-european-championship
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_EUROCOPA }}
          - name: copa-da-liga-inglesa
            type: competition
            slug: english-football-league-cup
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_ENGLISH_LEAGUE_CUP }}
          - name: ceara
            type: team
            slug: ceara
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_CEARA }}
          - name: brasil
            type: team
            slug: brazil
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_BRAZIL }}
          - name: copa-do-mundo
            type: competition
            slug: fifa-world-cup
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_WORLD_CUP }}
          - name: copa-do-mundo-feminina
            type: competition
            slug: fifa-womens-world-cup
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_WOMENS_WORLD_CUP }}
          - name: brasil-feminino
            type: team
            slug: brazil-women
            calendar_id: ${{ vars.GOOGLE_CALENDAR_ID_BRAZIL_WOMEN }}

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked runtime dependencies
        run: uv sync --locked --no-dev

      - name: Create credentials.json from secret
        if: matrix.target.calendar_id != ''
        env:
          GOOGLE_CREDENTIALS_JSON: ${{ secrets.GOOGLE_CREDENTIALS_JSON }}
        run: |
          python - << 'PY'
          import json
          import os
          import pathlib

          data = json.loads(os.environ["GOOGLE_CREDENTIALS_JSON"])
          path = pathlib.Path("credentials.json")
          path.write_text(json.dumps(data), encoding="utf-8")
          print("credentials.json generated successfully")
          PY

      - name: Sync calendar for ${{ matrix.target.name }}
        if: matrix.target.calendar_id != ''
        env:
          CALENDAR_ID: ${{ matrix.target.calendar_id }}
          TARGET_SLUG: ${{ matrix.target.slug }}
          TARGET_TYPE: ${{ matrix.target.type }}
        run: |
          uv run --locked --no-dev python match_sync.py gcalendar \
            --target-type "$TARGET_TYPE" \
            --slug "$TARGET_SLUG" \
            --calendar-id "$CALENDAR_ID"

      - name: Report missing optional calendar
        if: matrix.target.calendar_id == ''
        env:
          TARGET_NAME: ${{ matrix.target.name }}
        run: echo "Skipping $TARGET_NAME because its repository variable is not configured."
