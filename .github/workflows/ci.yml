name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: Commit, branch, or tag to validate
        required: true
        default: main
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || inputs.ref || github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: CI / required
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out requested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ inputs.ref || github.ref }}

      - name: Audit GitHub Actions
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
          annotations: true
          collect: workflows-only
          online-audits: false
          version: 1.14.2

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.3"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Check formatting
        run: uv run --locked ruff format --check .

      - name: Lint
        run: uv run --locked ruff check .

      - name: Check types
        run: uv run --locked mypy

      - name: Validate Python sources
        run: uv run --locked python -m compileall -q match_sync.py sportscore_client.py

      - name: Run tests
        run: uv run --locked python -m unittest -v

      - name: Record validation
        env:
          CI_EVENT_NAME: ${{ github.event_name }}
        run: |
          {
            echo "## CI approved"
            echo "- Git commit: `$(git rev-parse HEAD)`"
            echo "- Trigger: `$CI_EVENT_NAME`"
          } >> "$GITHUB_STEP_SUMMARY"
