version: 2
updates:
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "build"
      include: "scope"

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 0
    commit-message:
      prefix: "ci"
      include: "scope"
